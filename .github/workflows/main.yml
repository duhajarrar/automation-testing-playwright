on:
  
  pull_request:
    branches:
    - master
  push:
    branches:
      - master
  
jobs:
  test:
    name: Playwright test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js v22.11.0
      uses: actions/setup-node@v4
      with:
        node-version: v22.11.0

    - name: npm install
      run: |
        npm install
    - name: run localhost server
      working-directory: Playwright_Test_Lab_Server
      run: |
        npm start &
 
    - name: run playwright test
      run: |
        npx playwright install
        npx playwright test
