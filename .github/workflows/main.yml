on:
  pull_request:
    branches:
    - master
jobs:
  test:
    name: Node test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node_version: ['20.x']
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js v22.11.0
      uses: actions/setup-node@v4
      with:
        node-version: v22.11.0

    - name: npm install
      run: |
        npm install
 
    - name: run playwright test
      run: |
        npx playwright test
